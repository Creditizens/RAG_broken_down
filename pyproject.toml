[project]
name = "rag-broken-down-simply"
version = "0.1.0"
description = "A small, component-by-component RAG example using LangChain and Ollama."
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain==1.4.0",
    "langchain-core==1.6.3",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.2",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "typing-extensions==4.16.0",
]

[tool.uv]
package = false
